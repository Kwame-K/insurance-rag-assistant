[project]
name = "insurance-rag-assistant"
version = "0.1.0"
description = "A grounded bilingual RAG assistant for insurance documentation."
readme = "README.md"
authors = [
    { name = "Kristian", email = "kristian.klaban@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
insurance-rag-assistant = "insurance_rag_assistant:main"
insurance-rag = "insurance_rag_assistant.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260906",
]
